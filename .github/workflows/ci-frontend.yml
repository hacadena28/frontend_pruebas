name: Frontend CI Pipeline

on:
  push:
    branches: [ "develop", "qa", "main" ]
  pull_request:
    branches: [ "develop", "qa", "main" ]

jobs:
  build-and-unit-tests:
    name: Build & Unit Tests
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist/
          retention-days: 10

      - name: Run Unit Tests (Vitest)
        run: npm run test:coverage

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: coverage/
          retention-days: 10

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        with:
          skipSignatureVerification: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: "http://localhost:9000"

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: self-hosted
    needs: build-and-unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: dist/

      - name: Run E2E tests
        env:
          CI: 1
        run: npx playwright test

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 10

  cypress-tests:
    name: Cypress Tests
    runs-on: self-hosted
    needs: build-and-unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: dist/

      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          start: npx http-server dist/vehicle-management-ui/browser -p 4200
          wait-on: 'http://localhost:4200'
          wait-on-timeout: 120

      - name: Upload Cypress Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-report
          path: cypress/reports/html/
          retention-days: 10

  owasp-zap:
    name: OWASP ZAP Security Scan
    runs-on: self-hosted
    needs: build-and-unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: dist/

      - name: Start Static Server
        run: Start-Process -NoNewWindow npx -ArgumentList "http-server", "dist/vehicle-management-ui/browser", "-p", "4200"

      - name: Wait for Server
        run: |
          $maxRetries = 10
          $retryCount = 0
          while ($retryCount -lt $maxRetries) {
              try {
                  $response = Invoke-WebRequest -Uri "http://localhost:4200" -UseBasicParsing
                  break
              } catch {
                  Write-Host "Waiting for frontend static server..."
                  Start-Sleep -Seconds 2
                  $retryCount++
              }
          }
          if ($retryCount -eq $maxRetries) { Write-Error "Timeout waiting for frontend"; exit 1 }

      - name: Run OWASP ZAP Baseline Scan
        run: |
          docker run --rm -v "${PWD}:/zap/wrk/:rw" -t ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t http://host.docker.internal:4200 -r zap-report.html -I

      - name: Stop Frontend Server
        if: always()
        run: |
          $port = 4200
          $process = Get-NetTCPConnection -LocalPort $port -ErrorAction SilentlyContinue
          if ($process) { Stop-Process -Id $process.OwningProcess -Force -ErrorAction SilentlyContinue }

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: zap-report.html
          retention-days: 10

  deploy-pages:
    name: Deploy Reports to GitHub Pages
    runs-on: self-hosted
    needs: [build-and-unit-tests, e2e-tests, cypress-tests, owasp-zap]
    if: always()
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Playwright Report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: playwright-report
          path: public/playwright
          
      - name: Download Cypress Report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: cypress-report
          path: public/cypress

      - name: Download Frontend Coverage
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: frontend-coverage
          path: public/coverage
          
      - name: Download ZAP Report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: zap-report
          path: public/zap

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          destination_dir: frontend
          keep_files: true
