name: Frontend CI Pipeline

on:
  push:
    branches: [ "develop", "qa", "main" ]
  pull_request:
    branches: [ "develop", "qa", "main" ]

jobs:
  build-and-unit-tests:
    name: Build & Unit Tests
    runs-on: self-hosted
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build Application
        run: npm run build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist/
          retention-days: 10

      - name: Run Unit Tests (Vitest)
        run: npm run test:coverage

      - name: Upload Coverage Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: coverage/
          retention-days: 10

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@master
        with:
          skipSignatureVerification: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: "http://localhost:9000"

  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: self-hosted
    needs: build-and-unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: dist/

      - name: Run E2E tests
        env:
          CI: 1
        run: npx playwright test

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 10

  cypress-tests:
    name: Cypress Tests
    runs-on: self-hosted
    needs: build-and-unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: dist/

      - name: Run Cypress tests
        uses: cypress-io/github-action@v6
        with:
          start: npx --yes serve -s dist/vehicle-management-ui/browser -p 4200
          wait-on: 'http://localhost:4200'
          wait-on-timeout: 120

      - name: Upload Cypress Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cypress-report
          path: cypress/reports/html/
          retention-days: 10

  owasp-zap:
    name: OWASP ZAP Security Scan
    runs-on: ubuntu-latest
    needs: build-and-unit-tests
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: dist/

      - name: Serve frontend
        run: |
          npx --yes serve -s dist/vehicle-management-ui/browser -p 4200 &
          echo "Waiting for frontend..."
          for i in $(seq 1 15); do
            if curl -s -o /dev/null -w "%{http_code}" http://localhost:4200 | grep -q "200"; then
              echo "Frontend ready"
              break
            fi
            echo "Waiting... ($i/15)"
            sleep 2
          done

      - name: OWASP ZAP Full Scan
        continue-on-error: true
        uses: zaproxy/action-full-scan@v0.12.0
        with:
          target: 'http://localhost:4200'
          fail_action: false
          allow_issue_writing: false
          cmd_options: '-a'

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: |
            report_json.json
            report_html.html
          retention-days: 10
